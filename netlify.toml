[build]
  publish = "."
  # Templates are generated before each deploy so canvas changes pushed to /source go live.
  command = "python3 tools/sync.py"

[[headers]]
  for = "/js/templates.js"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  node_bundler = "esbuild"
  # Chromium ships its own browser binary, so it is copied as-is instead of bundled
  external_node_modules = ["@sparticuz/chromium"]

# Shareable link for the catalog and order form only: https://<site>/order
[[redirects]]
  from = "/order/"
  to = "/order"
  status = 301
  force = true

[[redirects]]
  from = "/order"
  to = "/index.html"
  status = 200
